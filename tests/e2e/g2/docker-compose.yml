      LAN_SUBNET: 10.241.2.0/24
      OTHER_LAN_SUBNET: 10.241.1.0/24

networks:
  wan:
    ipam:
      config:
        - subnet: 11.40.0.0/24
  lan-a:
    ipam:
      config:
        - subnet: 10.241.1.0/24
  lan-b:
    ipam:
      config:
        - subnet: 10.241.2.0/24

volumes:
