        interface_name: wan0
    volumes:
      - dht-c-data:/data
      - ${G2_CONFIG_DIR:?G2_CONFIG_DIR is required}/dht-c.toml:/config.toml:ro

  a-quic:
    <<: *node
    cap_add:
      - NET_ADMIN
    entrypoint: ["/app/tests/e2e/g2/nat-peer-entrypoint.sh"]
    environment:
      RAMINGA_CONFIG_TEMPLATE: /config.toml
      RAMINGA_EXTRA_ARGS: --enable-test-api
      LAN_IF: lan0
      LAN_GATEWAY: 10.241.1.2
      OTHER_LAN_SUBNET: 10.241.2.0/24
    hostname: a-quic
    networks:
      lan-a:
        ipv4_address: 10.241.1.11
        interface_name: lan0
    volumes:
      - a-quic-data:/data
      - ${G2_CONFIG_DIR:?G2_CONFIG_DIR is required}/a-quic.toml:/config.toml:ro
    depends_on:
      nat-a:
        condition: service_healthy
      r1:
        condition: service_healthy
      r2:
        condition: service_healthy

  b-quic:
