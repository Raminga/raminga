# Raminga G2 Docker acceptance topology.
#
#   a-* --- LAN-A 10.241.1.0/24 --- NAT-A 11.40.0.10 --- WAN 11.40.0.0/24
#                                                        R1 .2 / R2 .3 / R-off .5
#                                                        R-quota .7 / dht-boot .6
#   b-* --- LAN-B 10.241.2.0/24 --- NAT-B 11.40.0.11 ---+
#
# No shared management network, no published host ports. Peers are only on
# their LAN; NAT routers use the strict conntrack rules copied read-only into
# tests/e2e/nat-router.sh (no static DNAT, no unconditional WAN->LAN ACCEPT).
# This is a Docker simulation, not real-world NAT or M6 evidence.

x-node: &node
  image: raminga-g2-e2e:local
  init: true
  stop_grace_period: 20s
  environment:
    RAMINGA_CONFIG_TEMPLATE: /config.toml
    RAMINGA_EXTRA_ARGS: --enable-test-api
    RAMINGA_LOG_LEVEL: ${G2_LOG_LEVEL:-info}
  healthcheck:
    test: ["CMD", "raminga", "status", "--data-dir", "/data"]
    interval: 1s
    timeout: 3s
    retries: 90
    start_period: 2s

x-router: &router
  image: raminga-g2-e2e:local
  init: true
  stop_grace_period: 10s
  entrypoint: ["/app/tests/e2e/nat-router.sh"]
  cap_add:
    - NET_ADMIN
  sysctls:
    - net.ipv4.ip_forward=1
    - net.ipv4.conf.all.forwarding=1
    - net.ipv4.conf.default.forwarding=1
    - net.ipv4.conf.all.rp_filter=0
    - net.ipv4.conf.default.rp_filter=0
    - net.netfilter.nf_conntrack_udp_timeout=30
    - net.netfilter.nf_conntrack_udp_timeout_stream=30
  healthcheck:
    test: ["CMD-SHELL", "test -f /run/nat-ready"]
    interval: 2s
    timeout: 3s
    retries: 45
    start_period: 10s

services:
  r1:
    <<: *node
    hostname: r1
    networks:
      wan:
        ipv4_address: 11.40.0.2
        interface_name: wan0
    volumes:
      - r1-data:/data
      - ${G2_CONFIG_DIR:?G2_CONFIG_DIR is required}/r1.toml:/config.toml:ro

  r2:
    <<: *node
    hostname: r2
    networks:
      wan:
        ipv4_address: 11.40.0.3
        interface_name: wan0
    volumes:
      - r2-data:/data
      - ${G2_CONFIG_DIR:?G2_CONFIG_DIR is required}/r2.toml:/config.toml:ro

  r-off:
    <<: *node
    hostname: r-off
    networks:
      wan:
        ipv4_address: 11.40.0.5
        interface_name: wan0
    volumes:
