  nat-a:
    <<: *router
    hostname: nat-a
    networks:
      wan:
        ipv4_address: 11.40.0.10
        interface_name: wan0
      lan-a:
        ipv4_address: 10.241.1.2
        interface_name: lan0
    environment:
      WAN_IF: wan0
      LAN_IF: lan0
      WAN_IP: 11.40.0.10
      WAN_GATEWAY: 11.40.0.1
      WAN_SUBNET: 11.40.0.0/24
      LAN_IP: 10.241.1.2
      LAN_SUBNET: 10.241.1.0/24
