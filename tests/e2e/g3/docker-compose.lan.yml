# Raminga G3 LAN facility: dual-stack Docker bridge with ULA IPv6.
#
# All peers share one LAN. There is no NAT and no relay here; the runner
# applies host-local ip6tables/iptables/tc rules for the IPv6, protocol-block
# and netem facilities, then runs the business scenarios. Docker is a
# simulation, not real-world evidence.

x-node: &node
  image: raminga-g3-e2e:local
  init: true
  stop_grace_period: 15s
  cap_add:
    - NET_ADMIN
  environment:
    RAMINGA_DATA_DIR: /data
    RAMINGA_CONFIG_TEMPLATE: /config.toml
    RAMINGA_EXTRA_ARGS: ${G3_EXTRA_ARGS---enable-test-api}
  healthcheck:
    test: ["CMD", "raminga", "status", "--data-dir", "/data"]
    interval: 1s
    timeout: 3s
    retries: 90
    start_period: 2s

services:
  a4:
    <<: *node
    hostname: a4
    networks:
      lan:
        ipv4_address: 10.250.1.11
        ipv6_address: fd00:250:1::11
    volumes:
      - a4-data:/data
      - ${G3_CONFIG_DIR:?G3_CONFIG_DIR is required}/a4.toml:/config.toml:ro
  b4:
    <<: *node
    hostname: b4
