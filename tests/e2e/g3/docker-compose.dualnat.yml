# Raminga G3 dual-NAT QUIC re-verification on the same strict topology as G2.
#
#   a-* --- LAN-A 10.249.1.0/24 --- NAT-A 11.41.0.10 --- WAN 11.41.0.0/24
#                                                          R1 .2 / R2 .3 / probe .20
#   b-* --- LAN-B 10.249.2.0/24 --- NAT-B 11.41.0.11 ---+
#
# No shared management network, no published host ports. NAT routers run the
# same tests/e2e/nat-router.sh strict conntrack rules used by G2 (no static
# DNAT, no unconditional WAN->LAN ACCEPT). Docker simulation only.

x-node: &node
  image: raminga-g3-e2e:local
  init: true
  stop_grace_period: 20s
  environment:
    RAMINGA_DATA_DIR: /data
    RAMINGA_CONFIG_TEMPLATE: /config.toml
    RAMINGA_EXTRA_ARGS: ${G3_EXTRA_ARGS---enable-test-api}
  healthcheck:
    test: ["CMD", "raminga", "status", "--data-dir", "/data"]
    interval: 1s
    timeout: 3s
    retries: 90
    start_period: 2s

x-router: &router
  image: raminga-g3-e2e:local
  init: true
  stop_grace_period: 10s
  cap_add:
    - NET_ADMIN
  sysctls:
    - net.ipv4.ip_forward=1
    - net.ipv4.conf.all.forwarding=1
    - net.ipv4.conf.default.forwarding=1
    - net.ipv4.conf.all.rp_filter=0
    - net.ipv4.conf.default.rp_filter=0
    - net.netfilter.nf_conntrack_udp_timeout=30
    - net.netfilter.nf_conntrack_udp_timeout_stream=30
  healthcheck:
    test: ["CMD-SHELL", "test -f /run/nat-ready"]
    interval: 2s
    timeout: 3s
    retries: 45
    start_period: 10s

x-nat-peer: &natPeer
  <<: *node
  cap_add:
    - NET_ADMIN
  entrypoint: ["/app/tests/e2e/g2/nat-peer-entrypoint.sh"]
  environment:
    RAMINGA_DATA_DIR: /data
    RAMINGA_CONFIG_TEMPLATE: /config.toml
    RAMINGA_EXTRA_ARGS: ${G3_EXTRA_ARGS---enable-test-api}
    LAN_IF: lan0
    LAN_GATEWAY: 10.249.1.2
    OTHER_LAN_SUBNET: 10.249.2.0/24
  networks:
    lan-a:
      interface_name: lan0

services:
  r1:
    <<: *node
    hostname: r1
    networks:
      wan:
        ipv4_address: 11.41.0.2
        interface_name: wan0
    volumes:
      - r1-data:/data
      - ${G3_CONFIG_DIR:?G3_CONFIG_DIR is required}/r1.toml:/config.toml:ro

  r2:
    <<: *node
    hostname: r2
    networks:
      wan:
        ipv4_address: 11.41.0.3
        interface_name: wan0
    volumes:
      - r2-data:/data
      - ${G3_CONFIG_DIR:?G3_CONFIG_DIR is required}/r2.toml:/config.toml:ro

  wan-probe:
    image: raminga-g3-e2e:local
    init: true
    cap_add:
      - NET_ADMIN
    hostname: wan-probe
    entrypoint: ["tail", "-f", "/dev/null"]
    networks:
      wan:
        ipv4_address: 11.41.0.20
        interface_name: wan0

  a-quic:
    <<: *natPeer
    hostname: a-quic
    networks:
      lan-a:
        ipv4_address: 10.249.1.10
        interface_name: lan0
    volumes:
      - a-quic-data:/data
      - ${G3_CONFIG_DIR:?G3_CONFIG_DIR is required}/a-quic.toml:/config.toml:ro
    depends_on:
      nat-a:
        condition: service_healthy
      r1:
        condition: service_healthy
      r2:
        condition: service_healthy

  b-quic:
    <<: *natPeer
    hostname: b-quic
    environment:
      RAMINGA_DATA_DIR: /data
      RAMINGA_CONFIG_TEMPLATE: /config.toml
      RAMINGA_EXTRA_ARGS: ${G3_EXTRA_ARGS---enable-test-api}
      LAN_IF: lan0
      LAN_GATEWAY: 10.249.2.2
      OTHER_LAN_SUBNET: 10.249.1.0/24
    networks:
      lan-b:
        ipv4_address: 10.249.2.10
        interface_name: lan0
    volumes:
      - b-quic-data:/data
      - ${G3_CONFIG_DIR:?G3_CONFIG_DIR is required}/b-quic.toml:/config.toml:ro
    depends_on:
      nat-b:
        condition: service_healthy
      r1:
        condition: service_healthy
      r2:
        condition: service_healthy

  a-tcp:
    <<: *natPeer
    hostname: a-tcp
    networks:
      lan-a:
        ipv4_address: 10.249.1.11
        interface_name: lan0
    volumes:
      - a-tcp-data:/data
      - ${G3_CONFIG_DIR:?G3_CONFIG_DIR is required}/a-tcp.toml:/config.toml:ro
    depends_on:
      nat-a:
        condition: service_healthy
      r1:
        condition: service_healthy

  b-tcp:
    <<: *natPeer
    hostname: b-tcp
    environment:
      RAMINGA_DATA_DIR: /data
      RAMINGA_CONFIG_TEMPLATE: /config.toml
      RAMINGA_EXTRA_ARGS: ${G3_EXTRA_ARGS---enable-test-api}
      LAN_IF: lan0
      LAN_GATEWAY: 10.249.2.2
      OTHER_LAN_SUBNET: 10.249.1.0/24
    networks:
      lan-b:
        ipv4_address: 10.249.2.11
        interface_name: lan0
    volumes:
      - b-tcp-data:/data
      - ${G3_CONFIG_DIR:?G3_CONFIG_DIR is required}/b-tcp.toml:/config.toml:ro
    depends_on:
      nat-b:
        condition: service_healthy
      r1:
        condition: service_healthy

  a-relay:
    <<: *natPeer
    hostname: a-relay
    networks:
      lan-a:
        ipv4_address: 10.249.1.12
        interface_name: lan0
    volumes:
      - a-relay-data:/data
      - ${G3_CONFIG_DIR:?G3_CONFIG_DIR is required}/a-relay.toml:/config.toml:ro
    depends_on:
      nat-a:
        condition: service_healthy
      r1:
        condition: service_healthy
      r2:
        condition: service_healthy

  b-relay:
    <<: *natPeer
    hostname: b-relay
    environment:
      RAMINGA_DATA_DIR: /data
      RAMINGA_CONFIG_TEMPLATE: /config.toml
      RAMINGA_EXTRA_ARGS: ${G3_EXTRA_ARGS---enable-test-api}
      LAN_IF: lan0
      LAN_GATEWAY: 10.249.2.2
      OTHER_LAN_SUBNET: 10.249.1.0/24
    networks:
      lan-b:
        ipv4_address: 10.249.2.12
        interface_name: lan0
    volumes:
      - b-relay-data:/data
      - ${G3_CONFIG_DIR:?G3_CONFIG_DIR is required}/b-relay.toml:/config.toml:ro
    depends_on:
      nat-b:
        condition: service_healthy
      r1:
        condition: service_healthy
      r2:
        condition: service_healthy

  nat-a:
    <<: *router
    hostname: nat-a
    entrypoint: ["/app/tests/e2e/nat-router.sh"]
    networks:
      wan:
        ipv4_address: 11.41.0.10
        interface_name: wan0
      lan-a:
        ipv4_address: 10.249.1.2
        interface_name: lan0
    volumes:
      - ../nat-router.sh:/app/tests/e2e/nat-router.sh:ro
    environment:
      WAN_IF: wan0
      LAN_IF: lan0
      WAN_IP: 11.41.0.10
      WAN_GATEWAY: 11.41.0.1
      WAN_SUBNET: 11.41.0.0/24
      LAN_IP: 10.249.1.2
      LAN_SUBNET: 10.249.1.0/24
      OTHER_LAN_SUBNET: 10.249.2.0/24

  nat-b:
    <<: *router
    hostname: nat-b
    entrypoint: ["/app/tests/e2e/nat-router.sh"]
    networks:
      wan:
        ipv4_address: 11.41.0.11
        interface_name: wan0
      lan-b:
        ipv4_address: 10.249.2.2
        interface_name: lan0
    volumes:
      - ../nat-router.sh:/app/tests/e2e/nat-router.sh:ro
    environment:
      WAN_IF: wan0
      LAN_IF: lan0
      WAN_IP: 11.41.0.11
      WAN_GATEWAY: 11.41.0.1
      WAN_SUBNET: 11.41.0.0/24
      LAN_IP: 10.249.2.2
      LAN_SUBNET: 10.249.2.0/24
      OTHER_LAN_SUBNET: 10.249.1.0/24

networks:
  wan:
    ipam:
      config:
        - subnet: 11.41.0.0/24
  lan-a:
    ipam:
      config:
        - subnet: 10.249.1.0/24
  lan-b:
    ipam:
      config:
        - subnet: 10.249.2.0/24

volumes:
  r1-data:
  r2-data:
  a-quic-data:
  b-quic-data:
  a-tcp-data:
  b-tcp-data:
  a-relay-data:
  b-relay-data:
