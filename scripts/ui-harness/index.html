<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Raminga UI · 本地验收 harness</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: #fafafc;
      color: #121220;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .harness-bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;
      padding: 6px 14px;
      border-bottom: 1px solid #d9d3e7;
      background: #f0edf7;
    }
    .harness-bar strong { font-size: 12px; letter-spacing: .2px; }
    .harness-badge {
      padding: 2px 7px;
      border: 1px solid #cfc5e3;
      border-radius: 999px;
      color: #5f5475;
      font-size: 10px;
      white-space: nowrap;
    }
    .harness-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; }
    .harness-controls button {
      height: 28px;
      padding: 0 9px;
      border: 1px solid #cfc5e3;
      border-radius: 7px;
      background: #fff;
      color: #514769;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    .harness-controls button:hover { background: #e7e0f5; }
    .harness-controls button[aria-pressed="true"] { background: #6845ed; border-color: #6845ed; color: #fff; }
    #mount { flex: 1; min-height: 0; display: block; }
    .harness-foot {
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 28px;
      padding: 4px 14px;
      border-top: 1px solid #e3e0ea;
      background: #fff;
      color: #68616f;
      font-size: 10px;
    }
    .harness-foot code { color: #514769; font-size: 10px; }
    .harness-foot output { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 760px) {
      .harness-bar { align-items: flex-start; flex-direction: column; gap: 5px; padding: 7px 10px; }
      .harness-controls { margin-left: 0; }
      .harness-controls button { height: 26px; font-size: 10px; }
      .harness-foot { display: none; }
    }
  </style>
</head>
<body>
  <header class="harness-bar">
    <strong>Raminga UI · 本地验收 harness</strong>
    <span class="harness-badge">模拟 DSH 主工作区挂载/卸载，非真实 DSH</span>
    <div class="harness-controls" role="group" aria-label="Harness 模拟控制">
      <button type="button" data-status="loading">加载中</button>
      <button type="button" data-status="ready" aria-pressed="true">正常状态</button>
      <button type="button" data-status="stale">更新中断</button>
      <button type="button" data-status="error">读取失败</button>
      <button type="button" data-status="closed">事件断流</button>
      <button type="button" id="pushEvent">推送事件</button>
      <button type="button" id="remount">卸载并重挂</button>
      <button type="button" id="destroy">卸载</button>
      <button type="button" id="reset">重置视图状态</button>
    </div>
  </header>
  <main id="mount" aria-label="Raminga 主工作区挂载点"></main>
  <footer class="harness-foot">
    <span>状态：<output id="harnessState">未挂载</output></span>
    <span>视图：<code id="harnessView">—</code></span>
    <span>截图脚本可读取 <code>window.__ramingaHarness</code>；本页所有节点数据均为模拟。</span>
  </footer>
  <script src="/bundle.js"></script>
  <script src="/harness.js"></script>
</body>
</html>
