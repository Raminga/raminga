name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The Makefile defaults these to .local/ for local work. Point them at the
      # directories setup-go caches, or every run downloads and compiles again.
      GOMODCACHE: /home/runner/go/pkg/mod
      GOCACHE: /home/runner/.cache/go-build
      GOLANGCI_LINT_CACHE: /home/runner/.cache/golangci-lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          # A cache key is never overwritten, so changing how the cache is built
          # needs a new key. Including this file does that.
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}-
      - run: make check

  windows-api:
    # No Windows developer machine is available locally. This lane runs the
    # real daemon and the actual DSH client, and turns a skip into a failure.
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # The Windows job builds and tests only; the cache path is native.
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/dsh/package-lock.json
      - name: Build raminga.exe
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -o bin/raminga.exe ./cmd/raminga
          go build ./...
      - name: Windows protected-endpoint Go tests (no skips)
        shell: pwsh
        run: |
          $out = go test -count=1 -v -run '^(TestWindows|TestWriteAtomicReadIfPresent|TestReadIfPresentMissing)' ./internal/api/... 2>&1
          $out | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = $out -join "`n"
          $required = @(
            'TestWindowsWriteCreatesProtectedOwnerOnlyDACL',
            'TestWindowsRejectsAdditionalReadACE',
            'TestWindowsRejectsReparseDataDirectory',
            'TestWindowsRejectsNonRegularEndpoint',
            'TestWindowsCachedClientRejectsWidenedEndpointACL',
            'TestWriteAtomicReadIfPresentAndRemove',
            'TestReadIfPresentMissingDirectoryIsNotAnError'
          )
          foreach ($name in $required) {
            if ($text -notmatch [regex]::Escape("--- PASS: $name")) {
              throw "required Windows test did not pass: $name"
            }
          }
          if ($text -match '--- SKIP: TestWindows|\[skipped\]') {
            throw 'a required Windows check reported skip'
          }
      - name: Install and build DSH plugin
        working-directory: plugins/dsh
        run: |
          # package-lock omits the not-yet-published optional platform
          # packages, so `npm ci` rejects it. Match the release script: install
          # from package.json without rewriting the lock or fetching optionals.
          npm install --no-save --no-package-lock --omit=optional --ignore-scripts --no-audit --no-fund
          npx tsc -p tsconfig.json
      - name: Real Windows TCP API and DSH client integration
        working-directory: plugins/dsh
        env:
          RAMINGA_BIN: ${{ github.workspace }}/bin/raminga.exe
        run: node --test --test-reporter=spec test/windows-api.integration.test.mjs
